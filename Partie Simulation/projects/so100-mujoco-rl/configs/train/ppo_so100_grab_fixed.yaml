algo: ppo
env_id: SO100Grab-v0
env_config: configs/env/so100_grab_fixed.yaml
total_timesteps: 500000
seed: 42
device: auto
log_dir: outputs/logs/ppo_so100_grab_fixed
model_dir: outputs/models
checkpoint_freq: 50000

policy: MlpPolicy
learning_rate: 0.0003
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
verbose: 1
tensorboard_log: outputs/logs/tensorboard
